name: relayops
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayops
      POSTGRES_PASSWORD: relayops_local_only
      POSTGRES_DB: relayops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayops -d relayops"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://relayops:relayops_local_only@db:5432/relayops
      DEMO_MODE: "true"
    command: sh -c "alembic upgrade head && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4 app:app"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
