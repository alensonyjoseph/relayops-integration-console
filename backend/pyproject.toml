[project]
name = "relayops-api"
version = "1.0.0"
description = "RelayOps Flask API for synthetic logistics event processing"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "alembic>=1.14,<2",
    "gunicorn>=23,<25",
]

# Vercel's Python builder uses this project metadata when a pyproject.toml
# exists. Keep runtime dependencies aligned with requirements.txt for Docker/CI.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
