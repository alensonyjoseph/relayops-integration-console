name: RelayOps CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python, PostgreSQL & migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops_ci_only
          POSTGRES_DB: relayops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://relayops:relayops_ci_only@localhost:5432/relayops_ci
      DATABASE_URL: postgresql+psycopg://relayops:relayops_ci_only@localhost:5432/relayops_ci
      DEMO_MODE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff checks
        run: python -m ruff check relayops tests
      - name: Regression and integration tests on PostgreSQL
        run: python -m pytest -q
      - name: Verify Alembic schema migration
        run: alembic upgrade head
      - name: Verify schema revision
        run: alembic current

  frontend:
    name: TypeScript & Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
